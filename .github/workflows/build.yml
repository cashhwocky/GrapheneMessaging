name: Build and Output APK

on:
  push:
    branches: [ main, master ] # Runs when you push code to your fork
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub Actions

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain

      # THIS STEP SAVES AND OUTPUTS YOUR APK
      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrapheneOS-Messaging-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
